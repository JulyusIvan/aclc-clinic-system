{% extends "Base/base.html" %}
{% block title %}Edit Examination{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='editexamination.css') }}">
<div class="container mt-4">
  <div class="card shadow rounded-4 border-0">
    <div class="card-header bg-primary text-white rounded-top-4">
      <h4 class="mb-0 fw-semibold">✏️ Edit Examination - {{ student.first_name }} {{ student.last_name }}</h4>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('edit_examination', exam_id=exam.id) }}">
        <div class="mb-4">
          <label class="form-label fw-semibold">Examination Date</label>
          <input type="date" name="examine_date" class="form-control rounded-3" required value="{{ exam.examine_date }}">
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Symptoms / Complaints</label>
          <textarea name="symptoms" rows="4" class="form-control rounded-3" required>{{ exam.symptoms }}</textarea>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Assign Nurse</label>
          <select name="nurse_id" class="form-select rounded-3" required>
            <option value="">-- Select Nurse --</option>
            {% for nurse in nurses %}
              <option value="{{ nurse.id }}" {% if nurse.id == exam.nurse_id %}selected{% endif %}>
                {{ nurse.first_name }} {{ nurse.last_name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Assign Doctor</label>
          <select name="doctor_id" class="form-select rounded-3">
            <option value="">-- Select Doctor (optional) --</option>
            {% for doctor in doctors %}
              <option value="{{ doctor.id }}" {% if doctor.id == exam.doctor_id %}selected{% endif %}>
                {{ doctor.first_name }} {{ doctor.last_name }} ({{ doctor.specialization }})
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('nurse_view_examinations') }}" class="btn btn-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-success px-4">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
