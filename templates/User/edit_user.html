{% extends "Base/base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='reg.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="custom-register-card">
      <h4 class="text-center mb-4">Edit User</h4>
      <form method="post">

        <div class="form-icon-input">
          <i class="bi bi-person-fill"></i>
          <input type="text" name="username" placeholder="Username" value="{{ user.username }}" required>
        </div>

        <div class="form-icon-input">
          <i class="bi bi-lock-fill"></i>
          <input type="password" name="password" placeholder="New Password (Leave blank to keep current)">
        </div>

        <div class="form-icon-input">
          <i class="bi bi-person-badge-fill"></i>
          <select name="role" required>
            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
            <option value="nurse" {% if user.role == 'nurse' %}selected{% endif %}>Nurse</option>
            <option value="doctor" {% if user.role == 'doctor' %}selected{% endif %}>Doctor</option>
          </select>
        </div>

        <button type="submit" class="register-btn">UPDATE</button>
        <a href="{{ url_for('view_users') }}" class="cancel-btn">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
