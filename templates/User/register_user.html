{% extends "Base/base.html" %}
{% block title %}Register User{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='reg.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="custom-register-card">
      <h4 class="text-center mb-4">Register New User</h4>
      <form method="post">
        
        <div class="form-icon-input">
          <i class="bi bi-person-fill"></i>
          <input type="text" name="username" placeholder="Username" required>
        </div>
        
        <div class="form-icon-input">
          <i class="bi bi-lock-fill"></i>
          <input type="password" name="password" placeholder="Password" required>
        </div>
        
        <div class="form-icon-input">
          <i class="bi bi-person-badge-fill"></i>
          <select name="role" required>
            <option value="" disabled selected>Select Role</option>
            <option value="admin">Admin</option>
            <option value="nurse">Nurse</option>
            <option value="doctor">Doctor</option>
          </select>
        </div>

        <button type="submit" class="register-btn">REGISTER</button>
        <a href="{{ url_for('admin_dashboard') }}" class="cancel-btn">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
